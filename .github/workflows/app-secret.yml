name: Android debug signing verify

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/app-secret.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/app-secret.yml'
jobs:
  signing-report:
    name: Print SHA1 and SHA256 (signingReport)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -storetype JKS \
              -keystore ~/.android/debug.keystore \
              -alias AndroidDebugKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Calculate expected debug SHA1/SHA256
        id: expected
        run: |
          EXPECTED_SHA1="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android \
            | grep -m1 "SHA1:" | sed 's/.*SHA1:[[:space:]]*//')"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android \
            | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')"

          if [ -z "$EXPECTED_SHA1" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "Failed to extract expected SHA fingerprints from debug keystore"
            exit 1
          fi

          echo "expected_sha1=${EXPECTED_SHA1}" >> "$GITHUB_OUTPUT"
          echo "expected_sha256=${EXPECTED_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Assemble Debug APKs
        run: ./gradlew assembleDebug

      - name: Generate Android signing report (SHA1 & SHA256)
        run: ./gradlew signingReport

      - name: Verify APK signatures match debug keystore
        run: |
          set -uo pipefail

          ROBOT_APK="robot/build/outputs/apk/debug/robot-debug.apk"
          CONTROLLER_APK="controller/build/outputs/apk/debug/controller-debug.apk"

          if [ ! -f "$ROBOT_APK" ]; then
            echo "Missing APK: $ROBOT_APK"
            exit 1
          fi
          if [ ! -f "$CONTROLLER_APK" ]; then
            echo "Missing APK: $CONTROLLER_APK"
            exit 1
          fi

          if command -v apksigner >/dev/null 2>&1; then
            APK_SIGNER="apksigner"
          else
            APK_SIGNER="$(ls "${ANDROID_HOME:-$HOME}/build-tools"/*/bin/apksigner 2>/dev/null | awk 'NR==1{print; exit}')"
            if [ -z "${APK_SIGNER:-}" ]; then
              echo "apksigner not found on runner; cannot verify APK signatures."
              exit 1
            fi
          fi

          verify_one() {
            local apk="$1"
            echo "Verifying: $apk"

            local out
            out="$($APK_SIGNER verify --print-certs "$apk" 2>&1)"
            local rc=$?
            echo "$out"

            if [ "$rc" -ne 0 ]; then
              echo "apksigner verify failed (exit code: $rc) for: $apk"
              exit "$rc"
            fi

            # Normalize fingerprints by removing ':' so comparison works regardless of format.
            local expected_sha1="${{ steps.expected.outputs.expected_sha1 }}"
            local expected_sha256="${{ steps.expected.outputs.expected_sha256 }}"
            local out_norm
            out_norm="$(echo "$out" | tr -d ':')"
            local expected_sha1_norm
            expected_sha1_norm="$(echo "$expected_sha1" | tr -d ':')"
            local expected_sha256_norm
            expected_sha256_norm="$(echo "$expected_sha256" | tr -d ':')"

            echo "$out_norm" | grep -q "$expected_sha1_norm" || { echo "SHA1 mismatch for $apk"; exit 1; }
            echo "$out_norm" | grep -q "$expected_sha256_norm" || { echo "SHA256 mismatch for $apk"; exit 1; }
            echo "OK: fingerprints match expected debug keystore."
          }

          verify_one "$ROBOT_APK"
          verify_one "$CONTROLLER_APK"
