name: Android workflow 

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/app-secret.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/app-secret.yml'
jobs:
  signing-report:
    name: Print SHA1 and SHA256 (signingReport)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

     - name: Generate SHA Fingerprints
        run: |
               keytool -list -v -keystore ./android/robot/release.keystore -alias test-alias -storepass test123 -keypass test123
        env:
              KEYSTORE_PASSWORD: test123
              KEY_ALIAS: test-alias
              KEY_PASSWORD: test123